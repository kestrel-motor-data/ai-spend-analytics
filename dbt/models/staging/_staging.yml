version: 2

models:
  - name: stg_azure_openai_usage
    description: Cleaned Azure OpenAI usage, one row per day, API key and deployment.
    columns:
      - name: usage_date
        description: >-
          Usage day. US Central through 2027-04-08; from the version 2
          export (usage for 2027-04-09 on) this is the UTC day, so totals
          shift slightly at the cutover.
        tests: [not_null]
      - name: api_key_id
        description: Azure OpenAI API key; owner in stg_api_keys.
        tests: [not_null]
      - name: deployment
        description: Model deployment the key called.
        tests: [not_null]
      - name: input_tokens
        description: Prompt tokens.
      - name: output_tokens
        description: Completion tokens.
      - name: cost_usd
        description: Cost in US dollars as billed.
        tests: [not_null]
      - name: _load_id
        description: The load that wrote this row.
      - name: _loaded_at
        description: When that load ran, UTC.
  - name: stg_m365_copilot_usage
    description: Cleaned Microsoft 365 Copilot usage, one row per day, user and app.
    columns:
      - name: day
        description: Usage day, US Central.
        tests: [not_null]
      - name: user_id
        description: HR employee id.
        tests: [not_null]
      - name: app
        description: Microsoft 365 app the prompts were made in.
      - name: prompts
        description: Prompts sent that day.
  - name: stg_m365_copilot_seats
    description: Microsoft 365 Copilot seats.
    columns:
      - name: user_id
        description: HR employee id holding the seat.
        tests: [not_null, unique]
      - name: assigned_date
        description: First day the seat is billed.
      - name: removed_date
        description: First day the seat is no longer billed; null while assigned.
      - name: monthly_cost
        description: Seat price per month, US dollars.
  - name: stg_api_keys
    description: Owning department of each Azure OpenAI API key.
    columns:
      - name: api_key_id
        description: Azure OpenAI API key.
        tests: [not_null, unique]
      - name: department
        description: Owning department.
  - name: stg_hr_employees
    description: HR roster without personal data.
    columns:
      - name: employee_id
        description: HR employee id.
        tests: [not_null, unique]
      - name: github_login
        description: GitHub login, where the employee has one.
      - name: department
        description: Department.
      - name: plant
        description: Plant or head office.
  - name: stg_ai_budgets
    description: Monthly AI budget per department.
    columns:
      - name: department
        description: Department.
      - name: month
        description: First day of the month.
      - name: budget
        description: Budget in US dollars.
  - name: stg_github_copilot_usage
    description: Cleaned GitHub Copilot usage, one row per day and GitHub login.
    columns:
      - name: day
        description: Usage day, US Central.
        tests: [not_null]
      - name: github_login
        description: GitHub login; matched to department via stg_hr_employees.github_login.
        tests: [not_null]
      - name: editor
        description: Editor the suggestions were made in.
      - name: suggestions_count
        description: Suggestions shown that day.
      - name: acceptances_count
        description: Suggestions accepted that day.
      - name: lines_accepted
        description: Lines of accepted suggestions.
      - name: chat_turns
        description: Copilot Chat turns that day.
  - name: stg_github_copilot_seats
    description: >
      GitHub Copilot seat snapshot, one row per day the load ran and per
      seat assigned at that time. The vendor API has no removal date or
      history endpoint, so a seat simply stops appearing once revoked;
      backfilled days only see seats held as of today's snapshot.
    columns:
      - name: day
        description: The day this snapshot was taken, US Central.
        tests: [not_null]
      - name: github_login
        description: GitHub login holding the seat; matched to department via stg_hr_employees.github_login.
        tests: [not_null]
      - name: plan_type
        description: Copilot plan type, e.g. business.
      - name: created_at
        description: Day the seat was created; used to exclude days before the seat existed.
      - name: monthly_cost_usd
        description: Seat price per month, US dollars.
  - name: stg_anthropic_usage
    description: >
      Cleaned Anthropic API usage, one row per day, workspace and model, with
      cost computed from token counts against Kestrel's published price
      table (the proxy has no cost endpoint). Cache writes are billed at the
      5-minute rate; the proxy's docs say all cache writes are 5-minute writes
      today, but the 1-hour cache column is summed in at the same rate in case
      that changes.
    columns:
      - name: day
        description: Usage day, US Central.
        tests: [not_null]
      - name: workspace_id
        description: Anthropic workspace id; matched to department via stg_anthropic_workspaces.
        tests: [not_null]
      - name: model
        description: Claude model used.
        tests:
          - accepted_values: {values: ['claude-sonnet-4-5', 'claude-haiku-4-5', 'claude-opus-4-1']}
      - name: uncached_input_tokens
        description: Input tokens not served from cache.
      - name: cache_read_input_tokens
        description: Input tokens served from cache.
      - name: cache_creation_5m_input_tokens
        description: Input tokens written to the 5-minute cache.
      - name: cache_creation_1h_input_tokens
        description: Input tokens written to the 1-hour cache. Always 0 today; Kestrel's proxy only offers 5-minute cache writes.
      - name: output_tokens
        description: Output tokens generated.
      - name: total_tokens
        description: Sum of all token fields above.
      - name: cost_usd
        description: Spend in US dollars, computed from tokens at Kestrel's published per-model price table.
        tests: [not_null]
  - name: stg_anthropic_workspaces
    description: Which department owns each Anthropic API workspace.
    columns:
      - name: workspace_id
        description: Anthropic workspace id.
        tests: [not_null, unique]
      - name: workspace_name
        description: Workspace name.
      - name: department
        description: Owning department. Null when the workspace has no owner yet.
