version: 2

sources:
  - name: raw
    description: Landed vendor exports and reference data. Written only by the nightly load; never edited by hand.
    tables:
      - name: azure_openai_usage
        description: Azure OpenAI usage export, one row per day, API key and deployment.
      - name: m365_copilot_usage
        description: Microsoft 365 Copilot usage report, one row per day, user and app.
      - name: m365_copilot_seats
        description: Microsoft 365 Copilot licence assignments, $30 a seat a month.
      - name: api_keys
        description: Which department owns each Azure OpenAI API key.
      - name: hr_employees
        description: HR roster. `email` and `name` are personal data and must never appear in chat or email.
      - name: ai_budgets
        description: Monthly AI budget per department.
      - name: github_copilot_usage
        description: GitHub Copilot usage from the Kestrel Copilot usage API, one row per day and user.
      - name: github_copilot_seats
        description: GitHub Copilot seat snapshot from the Kestrel Copilot usage API, one row per day and assigned seat.
      - name: anthropic_workspaces
        description: Which department owns each Anthropic API workspace. A workspace with no department has no owner yet.
      - name: anthropic_usage
        description: Anthropic API usage from Kestrel's proxy, one row per day, workspace and model. No cost field; cost is computed in staging from token counts.
      - name: departments
        description: Finance's list of departments, one row per cost centre, with the plant each sits at.
