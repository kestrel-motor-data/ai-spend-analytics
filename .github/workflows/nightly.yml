# Loads landed files into raw, then rebuilds staging and marts.
# Runs on main only (the production environment allows no other branch), so
# only reviewed code ever writes to raw, staging or marts.
name: nightly

on:
  # The 02:00 US Central schedule ("0 7 * * *") is switched on once the sandbox
  # lands files by itself at 01:30; until then `sandbox run-nightly` starts it.
  workflow_dispatch:
    inputs:
      start_date:
        description: First day to load, YYYY-MM-DD. Empty means yesterday, US Central.
        required: false
      end_date:
        description: Last day to load. Empty means the same as start_date.
        required: false
      skip_ingest:
        description: Only rebuild the models from what is already in raw.
        type: boolean
        default: false

concurrency: nightly

jobs:
  load:
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      LANDING_BUCKET: ${{ vars.LANDING_BUCKET }}
      DBT_TARGET: prod
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_PIPELINE_KEY }}
      - name: Pick the days
        run: |
          start="${START_DATE:-$(TZ=America/Chicago date -d yesterday +%F)}"
          echo "START=$start" >> "$GITHUB_ENV"
          echo "END=${END_DATE:-$start}" >> "$GITHUB_ENV"
      - name: Load landed files
        if: ${{ !inputs.skip_ingest }}
        run: python -m ingest.run --start "$START" --end "$END"
      - name: Build models
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: Email the data engineer
        if: failure() && vars.ALERT_EMAIL != ''
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          ALERT_INBOX: ${{ vars.ALERT_INBOX }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg to "$ALERT_EMAIL" \
                --arg subject "Nightly load failed for $START to $END" \
                --arg text "The nightly AI spend load failed. Days: $START to $END. Run: $RUN_URL" \
                '{to: $to, subject: $subject, text: $text}' |
          curl -sf -X POST "https://api.agentmail.to/v0/inboxes/$ALERT_INBOX/messages/send" \
               -H "Authorization: Bearer $AGENTMAIL_API_KEY" -H "Content-Type: application/json" -d @-
      - name: Post in Data Alerts
        if: failure() && vars.SLACK_ALERTS_ENABLED == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg text "Nightly AI spend load failed for $START to $END: $RUN_URL" '{text: $text}' |
          curl -sf -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d @-
