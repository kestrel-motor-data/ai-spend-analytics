# Builds every pull request into the ci dataset, reading the real raw data.
# The CI service account can read raw and write only to ci.
name: ci

on:
  pull_request:

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      DBT_TARGET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q ingest
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CI_KEY }}
      - name: Build models
        working-directory: dbt
        run: dbt build --profiles-dir .
